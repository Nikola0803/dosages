<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0d9488"/>
  <!-- Syringe barrel -->
  <rect x="6" y="14" width="16" height="4" rx="1" fill="white" fill-opacity="0.9"/>
  <!-- Needle -->
  <line x1="22" y1="16" x2="27" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Plunger rod -->
  <rect x="4" y="15" width="3" height="2" rx="0.5" fill="white" fill-opacity="0.7"/>
  <!-- Fill indicator -->
  <rect x="6" y="14" width="8" height="4" rx="1" fill="white" fill-opacity="0.4"/>
  <!-- Tick marks -->
  <line x1="11" y1="14" x2="11" y2="18" stroke="#0d9488" stroke-width="0.8"/>
  <line x1="14" y1="14" x2="14" y2="18" stroke="#0d9488" stroke-width="0.8"/>
  <line x1="17" y1="14" x2="17" y2="18" stroke="#0d9488" stroke-width="0.8"/>
  <!-- Hub -->
  <path d="M6 15 L5 14.5 L5 17.5 L6 17 Z" fill="white" fill-opacity="0.7"/>
</svg>
